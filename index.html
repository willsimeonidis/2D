<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SWORD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #c {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #hint {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    #hint.hidden {
      opacity: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
      z-index: 5;
    }

    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      opacity: 0.04;
      z-index: 6;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 0.4s steps(6) infinite;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-2%, -3%); }
      30% { transform: translate(3%, 1%); }
      50% { transform: translate(-1%, 4%); }
      70% { transform: translate(4%, -2%); }
      90% { transform: translate(-3%, 3%); }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div id="hint">CLICK TO SWING</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');

    let W, H, CX, CY;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      CX = W / 2;
      CY = H / 2;
    }
    resize();
    window.addEventListener('resize', resize);

    const STATE = {
      IDLE: 0,
      PULL: 1,
      SWING: 2,
      IMPACT: 3,
      RECOVER: 4
    };

    let state = STATE.IDLE;
    let t0 = 0;
    let swordY = 0;
    let swordAngle = -Math.PI / 2;
    let pullAmount = 0;
    let cameraZoom = 1;
    let cameraRot = 0;
    let cameraShake = 0;
    let shakeX = 0, shakeY = 0;
    let flash = 0;
    let trail = [];
    let particles = [];
    let glitchLines = [];
    let speedLines = [];
    let impactRings = [];
    let frame = 0;
    let isAnimating = false;

    const DUR = {
      pull: 280,
      swing: 920,
      impact: 420,
      recover: 180
    };

    function drawSword(ctx, scale = 1) {
      ctx.save();
      ctx.scale(scale, scale);

      ctx.globalAlpha = 0.15;
      ctx.translate(3, 4);
      drawSwordShape(ctx, '#fff');
      ctx.globalAlpha = 1;
      ctx.translate(-3, -4);

      drawSwordShape(ctx, '#fff');

      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -38);
      ctx.lineTo(0, -210);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, -218);
      ctx.lineTo(4, -205);
      ctx.lineTo(-4, -205);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawSwordShape(ctx, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -218);
      ctx.lineTo(7, -200);
      ctx.lineTo(9, -40);
      ctx.lineTo(-9, -40);
      ctx.lineTo(-7, -200);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.moveTo(0, -205);
      ctx.lineTo(2.2, -195);
      ctx.lineTo(2.5, -50);
      ctx.lineTo(-2.5, -50);
      ctx.lineTo(-2.2, -195);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-28, -42);
      ctx.lineTo(-32, -36);
      ctx.lineTo(-22, -32);
      ctx.lineTo(-9, -34);
      ctx.lineTo(9, -34);
      ctx.lineTo(22, -32);
      ctx.lineTo(32, -36);
      ctx.lineTo(28, -42);
      ctx.lineTo(18, -46);
      ctx.lineTo(-18, -46);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = color;
      ctx.fillRect(-5.5, -34, 11, 52);

      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.8;
      for (let i = 0; i < 7; i++) {
        const y = -28 + i * 7;
        ctx.beginPath();
        ctx.moveTo(-5.5, y);
        ctx.lineTo(5.5, y);
        ctx.stroke();
      }

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(0, 22, 9, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(0, 22, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function spawnParticles(x, y, count, speed = 1) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (2 + Math.random() * 8) * speed;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s - 2,
          life: 1,
          decay: 0.012 + Math.random() * 0.025,
          size: 1 + Math.random() * 3.5,
          type: Math.random() > 0.6 ? 'spark' : 'shard'
        });
      }
    }

    function spawnImpactBurst(x, y) {
      spawnParticles(x, y, 55, 1.6);
      for (let i = 0; i < 18; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: -6 - Math.random() * 12,
          life: 1,
          decay: 0.018 + Math.random() * 0.02,
          size: 1.5 + Math.random() * 2.5,
          type: 'spark'
        });
      }
      for (let i = 0; i < 3; i++) {
        impactRings.push({
          x, y,
          r: 10 + i * 18,
          maxR: 140 + i * 80,
          life: 1,
          width: 3 - i * 0.7
        });
      }
    }

    function spawnGlitch() {
      glitchLines = [];
      const n = 4 + Math.floor(Math.random() * 6);
      for (let i = 0; i < n; i++) {
        glitchLines.push({
          y: Math.random() * H,
          h: 2 + Math.random() * 14,
          offset: (Math.random() - 0.5) * 40,
          life: 1,
          decay: 0.08 + Math.random() * 0.12
        });
      }
    }

    function spawnSpeedLines(dir = 1) {
      speedLines = [];
      for (let i = 0; i < 12; i++) {
        speedLines.push({
          x: Math.random() * W,
          y: Math.random() * H,
          len: 40 + Math.random() * 120,
          thick: 1 + Math.random() * 2,
          alpha: 0.15 + Math.random() * 0.35,
          speed: (8 + Math.random() * 18) * dir
        });
      }
    }

    function easeInCubic(t) { return t * t * t; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    function easeInQuint(t) { return t * t * t * t * t; }

    function update(now) {
      const dt = Math.min((now - (update.last || now)) / 16.67, 3);
      update.last = now;

      frame++;

      if (cameraShake > 0) {
        cameraShake *= 0.88;
        shakeX = (Math.random() - 0.5) * cameraShake * 18;
        shakeY = (Math.random() - 0.5) * cameraShake * 14;
        if (cameraShake < 0.05) cameraShake = 0;
      } else {
        shakeX = shakeY = 0;
      }

      if (flash > 0) flash *= 0.82;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.25 * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = impactRings.length - 1; i >= 0; i--) {
        const r = impactRings[i];
        r.r += (r.maxR - r.r) * 0.12 * dt;
        r.life -= 0.035 * dt;
        if (r.life <= 0) impactRings.splice(i, 1);
      }

      for (let i = glitchLines.length - 1; i >= 0; i--) {
        glitchLines[i].life -= glitchLines[i].decay * dt;
        if (glitchLines[i].life <= 0) glitchLines.splice(i, 1);
      }

      for (let i = speedLines.length - 1; i >= 0; i--) {
        const s = speedLines[i];
        s.y += s.speed * dt;
        if (s.y > H + 50 || s.y < -50) speedLines.splice(i, 1);
      }

      const elapsed = now - t0;

      if (state === STATE.IDLE) {
        swordY = 0.02 + Math.sin(now * 0.0012) * 0.008;
        swordAngle = -Math.PI / 2 + Math.sin(now * 0.0009) * 0.02;
        cameraZoom = 1;
        cameraRot = 0;
        pullAmount = 0;
      }
      else if (state === STATE.PULL) {
        const p = Math.min(elapsed / DUR.pull, 1);
        const e = easeOutCubic(p);
        pullAmount = e * 0.18;
        swordY = 0.02 - e * 0.04;
        swordAngle = -Math.PI / 2 - e * 0.18;
        cameraZoom = 1 + e * 0.12;
        cameraRot = e * 0.04;

        if (p >= 1) {
          state = STATE.SWING;
          t0 = now;
          spawnSpeedLines(1);
          trail = [];
        }
      }
      else if (state === STATE.SWING) {
        const p = Math.min(elapsed / DUR.swing, 1);
        let e;
        if (p < 0.55) {
          e = easeInQuint(p / 0.55) * 0.75;
        } else {
          e = 0.75 + easeOutBack((p - 0.55) / 0.45) * 0.35;
        }
        e = Math.min(e, 1.05);

        swordY = 0.02 + e * 0.92;
        swordAngle = -Math.PI / 2 + e * (Math.PI * 0.92);
        pullAmount = 0.18 * (1 - Math.min(p * 2.2, 1));

        cameraZoom = 1.12 + Math.sin(p * Math.PI) * 0.55;
        cameraRot = 0.04 + Math.sin(p * Math.PI * 1.4) * 0.12 - p * 0.06;

        if (frame % 2 === 0) {
          const pos = getSwordTip();
          trail.push({ x: pos.x, y: pos.y, life: 1 });
          if (trail.length > 22) trail.shift();
        }

        if (p > 0.25 && p < 0.85 && Math.random() < 0.12) {
          spawnGlitch();
        }

        if (p > 0.15 && p < 0.9 && frame % 3 === 0) {
          spawnSpeedLines(1);
        }

        if (p >= 1) {
          state = STATE.IMPACT;
          t0 = now;
          flash = 1;
          cameraShake = 1.4;
          const tip = getSwordTip();
          spawnImpactBurst(tip.x, tip.y);
          spawnGlitch();
          spawnParticles(tip.x, tip.y, 30, 2.2);
        }
      }
      else if (state === STATE.IMPACT) {
        const p = Math.min(elapsed / DUR.impact, 1);
        const e = easeOutCubic(p);

        swordY = 0.94 + Math.sin(p * Math.PI * 3) * 0.012 * (1 - e);
        swordAngle = -Math.PI / 2 + Math.PI * 0.92 + Math.sin(p * 8) * 0.03 * (1 - e);

        cameraZoom = 1.67 - e * 0.45;
        cameraRot = 0.1 - e * 0.08;

        if (p > 0.5 && Math.random() < 0.15) spawnGlitch();

        if (p >= 1) {
          state = STATE.RECOVER;
          t0 = now;
        }
      }
      else if (state === STATE.RECOVER) {
        const p = Math.min(elapsed / DUR.recover, 1);
        if (p < 0.35) {
          flash = Math.max(flash, 0.6 * (1 - p / 0.35));
        } else {
          swordY = 0.02;
          swordAngle = -Math.PI / 2;
          cameraZoom = 1;
          cameraRot = 0;
          pullAmount = 0;
          trail = [];
          if (p >= 1) {
            state = STATE.IDLE;
            isAnimating = false;
            hint.classList.remove('hidden');
          }
        }
      }

      for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].life -= 0.07 * dt;
        if (trail[i].life <= 0) trail.splice(i, 1);
      }
    }

    function getSwordTip() {
      const baseY = H * 0.12 + swordY * H * 0.72;
      const len = Math.min(W, H) * 0.38;
      const ang = swordAngle;
      return {
        x: CX + Math.cos(ang) * len * 0.95,
        y: baseY + Math.sin(ang) * len * 0.95
      };
    }

    function render() {
      ctx.save();
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      ctx.translate(CX + shakeX, CY + shakeY);
      ctx.rotate(cameraRot);
      ctx.scale(cameraZoom, cameraZoom);
      ctx.translate(-CX, -CY);

      ctx.strokeStyle = '#fff';
      for (const s of speedLines) {
        ctx.globalAlpha = s.alpha * 0.7;
        ctx.lineWidth = s.thick;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x, s.y - s.len);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      if (trail.length > 1) {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (let i = 1; i < trail.length; i++) {
          const a = trail[i - 1];
          const b = trail[i];
          const alpha = b.life * 0.45;
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = 3 + b.life * 8;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }

      for (const r of impactRings) {
        ctx.strokeStyle = `rgba(255,255,255,${r.life * 0.7})`;
        ctx.lineWidth = r.width * r.life;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      for (const p of particles) {
        ctx.globalAlpha = p.life;
        if (p.type === 'spark') {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#fff';
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size * 0.6);
        }
      }
      ctx.globalAlpha = 1;

      const baseY = H * 0.12 + swordY * H * 0.72;
      const swordScale = Math.min(W, H) * 0.00115;

      ctx.save();
      ctx.translate(CX, baseY);
      ctx.rotate(swordAngle + Math.PI / 2);
      ctx.translate(0, pullAmount * 40);
      drawSword(ctx, swordScale * 180);
      ctx.restore();

      ctx.restore();

      for (const g of glitchLines) {
        ctx.fillStyle = `rgba(255,255,255,${g.life * 0.25})`;
        ctx.fillRect(g.offset, g.y, W, g.h);
        ctx.fillStyle = `rgba(0,0,0,${g.life * 0.4})`;
        ctx.fillRect(g.offset + 8, g.y + 2, W * 0.3, g.h * 0.5);
      }

      if (flash > 0.02) {
        ctx.fillStyle = `rgba(255,255,255,${flash * 0.85})`;
        ctx.fillRect(0, 0, W, H);
      }

      ctx.fillStyle = 'rgba(0,0,0,0.03)';
      for (let y = 0; y < H; y += 3) {
        ctx.fillRect(0, y, W, 1);
      }
    }

    function loop(now) {
      update(now);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function trigger() {
      if (isAnimating) return;
      isAnimating = true;
      hint.classList.add('hidden');
      state = STATE.PULL;
      t0 = performance.now();
      trail = [];
      particles = [];
      impactRings = [];
      glitchLines = [];
      speedLines = [];
      flash = 0;
      cameraShake = 0;
    }

    canvas.addEventListener('click', trigger);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      trigger();
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        trigger();
      }
    });
  </script>
</body>
</html>
